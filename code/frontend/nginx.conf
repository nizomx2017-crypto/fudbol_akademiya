server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lokal Docker builddagi mavjud production API manzilini lokal backendga yo'naltiradi.
    sub_filter_types application/javascript;
    sub_filter "https://api.chorshanba.uz" "http://localhost:5000";
    sub_filter_once off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
