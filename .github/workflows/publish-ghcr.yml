name: Publish Docker images to GHCR

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: prod
        type: choice
        options:
          - prod
          - test
      service:
        description: Service to build and deploy
        required: true
        default: all
        type: choice
        options:
          - fe
          - be
          - all

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            short_name: fe
            context: ./code/frontend
            dockerfile: ./code/frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/oquv-markazi-frontend:latest
          - service: backend
            short_name: be
            context: ./code/Backend
            dockerfile: ./code/Backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/oquv-markazi-backend:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        if: >-
          matrix.service == 'frontend' &&
          (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.short_name)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            VITE_DISABLE_RECAPTCHA=true
            VITE_BUILD_MODE=development
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build and push backend image
        if: >-
          matrix.service == 'backend' &&
          (github.event_name == 'push' || inputs.service == 'all' || inputs.service == matrix.short_name)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy GHCR images to VPS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend and backend containers
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}
          DEPLOY_SERVICE: ${{ github.event_name == 'push' && 'all' || inputs.service }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

          trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_ENVIRONMENT='$DEPLOY_ENVIRONMENT' DEPLOY_SERVICE='$DEPLOY_SERVICE' bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          frontend_image="ghcr.io/nizomx2017-crypto/oquv-markazi-frontend:latest"
          backend_image="ghcr.io/nizomx2017-crypto/oquv-markazi-backend:latest"

          case "$DEPLOY_ENVIRONMENT" in
            prod)
              frontend_container="ghcr-frontend"
              frontend_port="8081"
              backend_container="ghcr-backend"
              backend_port="5051"
              ;;
            test)
              frontend_container="test-frontend"
              frontend_port="8082"
              backend_container="test-backend"
              backend_port="5052"
              ;;
            *)
              echo "Unsupported environment: $DEPLOY_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

          if [[ "$DEPLOY_SERVICE" == "be" || "$DEPLOY_SERVICE" == "all" ]]; then
            test -f /opt/oquv-markazi/backend.env
            docker network inspect oquv-network > /dev/null
            docker pull "$backend_image"

            if docker container inspect "$backend_container" > /dev/null 2>&1; then
              docker rm -f "$backend_container"
            fi

            docker run -d \
              --name "$backend_container" \
              --env-file /opt/oquv-markazi/backend.env \
              --network oquv-network \
              -p "$backend_port:5000" \
              --restart unless-stopped \
              "$backend_image"
          fi

          if [[ "$DEPLOY_SERVICE" == "fe" || "$DEPLOY_SERVICE" == "all" ]]; then
            docker pull "$frontend_image"

            if docker container inspect "$frontend_container" > /dev/null 2>&1; then
              docker rm -f "$frontend_container"
            fi

            docker run -d \
              --name "$frontend_container" \
              --network oquv-network \
              -p "$frontend_port:80" \
              --restart unless-stopped \
              "$frontend_image"
          fi

          docker ps \
            --filter "name=^/$backend_container$" \
            --filter "name=^/$frontend_container$" \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          REMOTE_SCRIPT
