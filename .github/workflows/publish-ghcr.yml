name: Publish Docker images to GHCR

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./code/frontend
            dockerfile: ./code/frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/oquv-markazi-frontend:latest
          - service: backend
            context: ./code/Backend
            dockerfile: ./code/Backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/oquv-markazi-backend:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            VITE_DISABLE_RECAPTCHA=true
            VITE_BUILD_MODE=development
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build and push backend image
        if: matrix.service == 'backend'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy GHCR images to VPS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend and backend containers
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

          trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -euo pipefail

          frontend_image="ghcr.io/nizomx2017-crypto/oquv-markazi-frontend:latest"
          backend_image="ghcr.io/nizomx2017-crypto/oquv-markazi-backend:latest"

          test -f /opt/oquv-markazi/backend.env
          docker network inspect oquv-network > /dev/null
          docker pull "$frontend_image"
          docker pull "$backend_image"

          if docker container inspect ghcr-backend > /dev/null 2>&1; then
            docker rm -f ghcr-backend
          fi

          docker run -d \
            --name ghcr-backend \
            --env-file /opt/oquv-markazi/backend.env \
            --network oquv-network \
            -p 5051:5000 \
            --restart unless-stopped \
            "$backend_image"

          if docker container inspect ghcr-frontend > /dev/null 2>&1; then
            docker rm -f ghcr-frontend
          fi

          docker run -d \
            --name ghcr-frontend \
            --network oquv-network \
            -p 8081:80 \
            --restart unless-stopped \
            "$frontend_image"

          docker ps \
            --filter 'name=^/ghcr-backend$' \
            --filter 'name=^/ghcr-frontend$' \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          REMOTE_SCRIPT
